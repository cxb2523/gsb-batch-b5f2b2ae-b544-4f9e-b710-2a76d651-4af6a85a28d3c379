# ==============================================================================
# RAIL CAMERA FIXTURE 04 — MISSING / DEGENERATE ENDPOINTS
# ==============================================================================
# Acceptance fixture: four rail shots exercising the endpoint fallback contract.
#   1. s1 — `track` with only `from:`  -> cart holds stationary at `from` (to = from).
#   2. s2 — `track` with only `to:`    -> cart glides from the cue seed eye to `to`.
#   3. s3 — `spline_track` with 1 pt   -> cart glides from seed eye to that point.
#   4. s4 — `spline_track` with 0 pts  -> cart holds stationary at the seed eye.
# Every frame must stay finite (no NaN) in position, target, yaw, pitch, distance.
# ==============================================================================

version: "1.0"
id: "rail-fixture-missing-endpoints"
title: "Rail Fixture · Missing Endpoint Fallbacks"
subtitle: "Start-only, end-only, 1-point and empty rails"
video: "procedural://rail-missing"
aspect_ratio: "16:9"
duration: 12.0

stage:
  width: 12
  depth: 12
  grid_step: 1
  observer_camera:
    target: [0, 1.1, 0]
    distance: 15.0
    pitch: 28
    yaw: 30
    lens: 35mm
  stage_camera:
    target: [0, 1.2, 0]
    distance: 4.0
    pitch: 6
    yaw: 0
    lens: 35mm

entities:
  - id: "marker"
    label: "Center Marker"
    kind: "marker"
    position: [0, 0, 0]
    color: "#94a3b8"

shots:
  - id: "shot-01-from-only"
    shot: 1
    label: "Track · From Only (Hold)"
    description: "Only a start point is authored: cart must hold stationary."
    start: 0.0
    end: 3.0
    stage_camera:
      rig:
        type: "track"
        from: [-2.0, 1.3, 4.0]
      target: [0, 1, 0]
      easing: "linear"

  - id: "shot-02-to-only"
    shot: 2
    label: "Track · To Only (Fallback Start)"
    description: "Only an end point is authored: cart glides from the fallback start eye."
    start: 3.0
    end: 6.0
    stage_camera:
      rig:
        type: "track"
        to: [2.0, 1.3, 4.0]
      target: [0, 1, 0]
      easing: "linear"

  - id: "shot-03-spline-one-point"
    shot: 3
    label: "Spline · Single Point"
    description: "A single spline waypoint: cart glides from the fallback start eye to it."
    start: 6.0
    end: 9.0
    stage_camera:
      rig:
        type: "spline_track"
        points:
          - [1.0, 1.3, 4.0]
      target: [0, 1, 0]
      easing: "linear"

  - id: "shot-04-spline-empty"
    shot: 4
    label: "Spline · Empty Points"
    description: "No spline waypoints: cart holds stationary at the fallback start eye."
    start: 9.0
    end: 12.0
    stage_camera:
      rig:
        type: "spline_track"
      target: [0, 1, 0]
      easing: "linear"
